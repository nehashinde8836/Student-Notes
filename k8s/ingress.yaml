apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studentnotes-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: studentnotes-backend
                port: {number: 5000}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: studentnotes-backend
                port: {number: 5000}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: studentnotes-frontend
                port: {number: 80}
